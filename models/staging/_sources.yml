version: 2

sources:
  - name: hubspot
    description: Raw HubSpot CRM objects, landed by extract/hubspot_to_bigquery.py (incremental on lastmodifieddate).
    schema: raw
    config:
      loaded_at_field: cast(lastmodifieddate as timestamp)
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: contacts
        identifier: hubspot_contacts
        description: >
          One row per contact version delivered by the loader. The same contact_id can
          appear more than once when the sync re-delivers an updated record.
        columns:
          - name: contact_id
            data_tests: [not_null]
      - name: deals
        identifier: hubspot_deals
        columns:
          - name: deal_id
            data_tests: [not_null, unique]

  - name: product
    description: Product usage events from the Memberspot app tracker.
    schema: raw
    tables:
      - name: events
        identifier: product_events
        config:
          loaded_at_field: cast(loaded_at as timestamp)
          freshness:
            warn_after: {count: 6, period: hour}

  - name: billing
    description: Subscription records from the billing system.
    schema: raw
    tables:
      - name: subscriptions
        identifier: billing_subscriptions
